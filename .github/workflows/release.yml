name: release

# Publishes to PyPI when a vX.Y.Z tag is pushed. Uses PyPI trusted publishing:
# the `github-milestone-roadmap` project on PyPI must list this repository,
# this workflow (release.yml) and the `pypi` environment as a trusted publisher.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed for the hatch-vcs version
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/github-milestone-roadmap/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
