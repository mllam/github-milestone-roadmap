name: pytest

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed for the hatch-vcs version
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest
      - name: Build example site
        run: uv run --python ${{ matrix.python-version }} github-milestone-roadmap build --config examples/roadmap.toml --output _site
